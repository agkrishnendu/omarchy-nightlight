name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Omarchy ships 3.13; the older version keeps the stdlib-only promise honest
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: CLI smoke test
        # A plugin-free HOME: status must work and touch nothing
        run: |
          export HOME="$(mktemp -d)"
          python3 -B src/nightlight-schedule.py status --json
          test -z "$(ls -A "$HOME")"
      - name: No bytecode left in the plugin folder
        # The Omarchy shell hot-reloads the plugin on any file change there
        run: |
          found="$(find . -name __pycache__ -not -path './.git/*')"
          if [ -n "$found" ]; then echo "left behind: $found"; exit 1; fi
